<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UrbanDrip Thrift</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ud-root">
        <div class="phone">
            <header style="padding: 40px 20px; text-align: center; border-bottom: 1px solid #333;">
                <h1 style="color: white; font-family: 'Bebas Neue', sans-serif; font-size: 3rem; margin: 0; letter-spacing: 4px;">
                    URBANDRIP
                </h1>
                <p style="color: #888; font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px;">
                    Thrift & Vintage
                </p>
            </header>

            <div id="screen-host" style="padding: 20px; min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                
                <div style="border: 1px solid #444; padding: 40px; text-align: center; width: 80%;">
                    <h2 style="color: white; font-family: 'Space Grotesk', sans-serif; font-weight: 300;">DROP 01</h2>
                    <p style="color: #666; font-size: 0.8rem; margin-bottom: 20px;">DEHRADUN, INDIA</p>
                    <button style="background: white; color: black; border: none; padding: 12px 24px; font-family: 'Space Grotesk', sans-serif; font-weight: bold; cursor: pointer;">
                        COMING SOON
                    </button>
                </div>

            </div>

            <div id="nav-host" style="position: fixed; bottom: 0; width: 100%; height: 60px; background: #111; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; color: white; font-family: 'Space Grotesk', sans-serif; font-size: 0.7rem;">
                <span>SHOP</span>
                <span>SEARCH</span>
                <span>CART</span>
                <span>PROFILE</span>
            </div>

            <div id="modal-host"></div>
            <div id="toast" class="toast-el"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
